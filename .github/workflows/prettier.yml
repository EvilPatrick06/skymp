name: Prettier
on: [push, pull_request]
jobs:
  prettier:
    if: github.repository == 'skyrim-multiplayer/skymp'  # upstream only, not the Thornswood fork (Thornswood #1774)
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yarn packages
        uses: borales/actions-yarn@97ba8bebfe5b549bb7999261698a52a81fd62f1b # v4.2.0
        with:
          cmd: --cwd=./misc/prettier install
      - name: Check prettier errors
        uses: borales/actions-yarn@97ba8bebfe5b549bb7999261698a52a81fd62f1b # v4.2.0
        with:
          cmd: --cwd=./misc/prettier prettier-check
        continue-on-error: true
